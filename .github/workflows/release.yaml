---
name: Release
on:
  workflow_run:
    workflows: ['Docker Build & Push']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queue, never cancel: a run cancelled after semantic-release has published
# the GitHub Release but before promote-image leaves a release tag with no
# image on GHCR (that is how v1.7.1 ended up without one). With
# cancel-in-progress: false a running release always finishes; GitHub still
# drops older *pending* runs, and the next run releases everything merged since.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release releases everything on main, but promote-image copies
      # the image of the build that triggered this run (workflow_run.head_sha).
      # If main has moved on since that build, the two do not match: v1.35.1
      # was cut from main with #269 but got the #266 image (Backstage 1.49),
      # because #269's own build failed and #266's finished later. So only
      # release when the triggering build is the newest real commit on main;
      # otherwise the newer commit's own build releases (or, if it fails,
      # nothing does until a fix lands). chore(release) commits are skipped:
      # they are [skip ci] and never get an image.
      - name: Check the build is the current main
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != workflow_run ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet origin main
          MAIN_SHA=$(git log -1 --format=%H --invert-grep --grep='^chore(release):' origin/main)
          if [ "$BUILT_SHA" = "$MAIN_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build ${BUILT_SHA:0:7} is not the newest commit on main (${MAIN_SHA:0:7}); its build releases instead."
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install semantic-release
        if: steps.guard.outputs.current == 'true'
        run: >-
          npm install -g
          semantic-release
          @semantic-release/changelog
          @semantic-release/git
          @semantic-release/github
          @semantic-release/exec

      - name: Run semantic-release
        id: semantic
        if: steps.guard.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release 2>&1 | tee /tmp/sr-output.txt
          if grep -q "Published release" /tmp/sr-output.txt; then
            VERSION=$(grep "Published release" /tmp/sr-output.txt | grep -oP '\d+\.\d+\.\d+')
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

  # Promote the freshly built image to GHCR under the new release tag.
  #
  # This lives here (not in crane-tag.yaml's `release: published` trigger)
  # because semantic-release publishes the GitHub Release with the default
  # GITHUB_TOKEN, and GitHub does not trigger workflows from GITHUB_TOKEN
  # events — so the `release: published` promotion never fired. Promoting
  # inline avoids that, and uses the commit that was actually built to
  # ttl.sh (workflow_run.head_sha) rather than semantic-release's own
  # `chore(release) [skip ci]` commit (which has no image).
  promote-image:
    name: Promote release image to GHCR
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # The commit Docker Build & Push built to ttl.sh. For workflow_run this
      # is the upstream run's head; for manual workflow_dispatch fall back to
      # the checked-out SHA.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERSION: ${{ needs.release.outputs.new_release_version }}

    steps:
      - name: Copy ttl.sh image to ghcr.io release tag
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 0.21.12
          module: github.com/stuttgart-things/dagger/crane@v0.136.0
          call: >-
            copy
            --source ttl.sh/stuttgart-things-sthings-backstage:${{ env.SOURCE_SHA }}
            --target ghcr.io/stuttgart-things/sthings-backstage:v${{ env.VERSION }}
            --target-registry ghcr.io
            --target-username ${{ github.actor }}
            --target-password env:REGISTRY_PASSWORD
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          # ghcr validates the basic-auth username, so it must be a real
          # account (passed inline via --target-username), not an env: ref —
          # the crane module only resolves env: for the password Secret.
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ttl.sh image to ghcr.io latest
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 0.21.12
          module: github.com/stuttgart-things/dagger/crane@v0.136.0
          call: >-
            copy
            --source ttl.sh/stuttgart-things-sthings-backstage:${{ env.SOURCE_SHA }}
            --target ghcr.io/stuttgart-things/sthings-backstage:latest
            --target-registry ghcr.io
            --target-username ${{ github.actor }}
            --target-password env:REGISTRY_PASSWORD
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          # ghcr validates the basic-auth username, so it must be a real
          # account (passed inline via --target-username), not an env: ref —
          # the crane module only resolves env: for the password Secret.
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🚀 Release image promoted to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** \`ttl.sh/stuttgart-things-sthings-backstage:${SOURCE_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`ghcr.io/stuttgart-things/sthings-backstage:v${VERSION}\`, \`:latest\`" >> $GITHUB_STEP_SUMMARY
