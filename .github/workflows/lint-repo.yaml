---
name: Run Repository Linting
on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main
      - feat/*
      - fix/*

jobs:
  Lint-Repository:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-repository-linting.yaml@15bb803fd72658fda50120f8a566d5594061e6ee # v1.2.0
    with:
      runs-on: ubuntu-latest
      environment-name: linting
      app-directory: "./"
      output-file: "/tmp/sthings-backstage.txt"
      continue-error: "true"
      # no dagger pins: template defaults apply (old v1.17.0 no longer builds, github-workflow-templates#234)
      branch-name: ${{ github.head_ref || github.ref_name }}
    secrets: inherit # pragma: allowlist secret
