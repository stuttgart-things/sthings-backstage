---
name: Docker Build & Push
on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main
      - feat/*
      - fix/*

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript compile
        run: yarn tsc

      - name: Build backend
        run: yarn build:backend

      - name: Set image name
        id: image-name
        run: |
          echo "name=stuttgart-things-sthings-backstage" >> $GITHUB_OUTPUT

      - name: Dagger Build and Push (ttl.sh)
        id: build-image
        uses: dagger/dagger-for-github@v8.4.1
        with:
          # Keep the engine pinned and bumped together with the
          # stuttgart-things/dagger module versions (dagger.json engineVersion).
          version: v0.21.10
          module: github.com/stuttgart-things/dagger/docker@v0.136.0
          call: >-
            build-and-push
            --source .
            --repository-name ${{ steps.image-name.outputs.name }}
            --registry-url ttl.sh
            --tag "${{ github.sha }}"
            --dockerfile packages/backend/Dockerfile
            --progress plain
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # The build passing does not mean the image starts: a missing native
      # binding (better-sqlite3 is the live database client in app-config.yaml)
      # only fails at runtime. Load the native modules inside the built image.
      - name: Smoke test image (native modules)
        run: |
          docker run --rm "ttl.sh/${{ steps.image-name.outputs.name }}:${{ github.sha }}" sh -c '
            set -e
            node -e "const D=require(\"better-sqlite3\");const d=new D(\":memory:\");d.prepare(\"select 1\").get();d.close();console.log(\"ok: better-sqlite3\")"
            node -e "const ivm=require(\"isolated-vm\");new ivm.Isolate().dispose();console.log(\"ok: isolated-vm\")"
            mkdocs --version
          '

      # Loading the modules is not enough: under Node 24.21.0 better-sqlite3
      # loaded fine but the backend segfaulted ~20s after start (#129, #141).
      # Start the backend with the shipped app-config.yaml, wait for readiness,
      # then require it to stay up and ready for another 30s.
      - name: Smoke test image (backend startup)
        run: |
          docker run -d --name smoke --network host \
            -e DAPR_SERVICE_TOKEN=smoke-test-token \
            -e APP_BASE_URL=http://localhost:3000 \
            -e GITHUB_TOKEN=x -e GHE_TOKEN=x -e GHE_URL=ghe.example.com \
            -e GITHUB_CLIENT_ID=x -e GITHUB_CLIENT_SECRET=x \
            "ttl.sh/${{ steps.image-name.outputs.name }}:${{ github.sha }}"

          ready() { [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7007/.backstage/health/v1/readiness)" = 200 ]; }
          running() { [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ]; }
          fail() { echo "::error::$1"; docker logs smoke 2>&1 | tail -50; exit 1; }

          for i in $(seq 1 60); do
            ready && break
            running || fail "backend exited before becoming ready"
            sleep 2
          done
          ready || fail "backend not ready after 120s"
          echo "ready after ~$((i * 2))s, checking it stays up"

          sleep 30
          running || fail "backend crashed after becoming ready"
          ready || fail "backend no longer ready 30s after startup"
          echo "ok: backend started and stayed ready"
          docker rm -f smoke >/dev/null

      - name: Scan image with Trivy
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.21.10
          module: github.com/stuttgart-things/dagger/trivy@v0.136.0
          call: scan-image --image-ref="ttl.sh/${{ steps.image-name.outputs.name }}:${{ github.sha }}" --severity="HIGH,CRITICAL" --trivy-version="0.64.1" export --path=/tmp/trivy-scan-report.json
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-report
          path: /tmp/trivy-scan-report.json
          retention-days: 30

      - name: Check for vulnerabilities
        run: |
          if command -v jq &> /dev/null; then
            VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' /tmp/trivy-scan-report.json 2>/dev/null || echo "0")
            echo "Found $VULN_COUNT HIGH/CRITICAL vulnerabilities"

            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "::warning::Image contains $VULN_COUNT HIGH/CRITICAL vulnerabilities"
              jq -r '.Results[]? | select(.Vulnerabilities) | "\(.Target): \(.Vulnerabilities | length) vulnerabilities"' \
                /tmp/trivy-scan-report.json
            else
              echo "✅ No HIGH/CRITICAL vulnerabilities found!"
            fi
          fi

      - name: Build Summary
        run: |
          echo "## 🎉 Container Image Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ttl.sh/${{ steps.image-name.outputs.name }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ttl.sh/${{ steps.image-name.outputs.name }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Note:** ttl.sh images expire after 1 hour" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if command -v jq &> /dev/null; then
            VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' /tmp/trivy-scan-report.json 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "### ⚠️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Found **$VULN_COUNT HIGH/CRITICAL vulnerabilities**" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ Security Scan Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "No HIGH/CRITICAL vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            fi
          fi
