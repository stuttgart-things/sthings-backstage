app:
  title: ${APP_TITLE:-sthings}
  baseUrl: ${APP_BASE_URL}
  # Frontend-visible auth feature flags. `oidcEnabled` controls whether the
  # SignInPage shows the Zitadel/OIDC button (the corresponding backend module
  # is also gated by AUTH_OIDC_ENABLED in packages/backend/src/index.ts).
  # GitHub stays always-on so existing flows are unaffected.
  auth:
    oidcEnabled: ${AUTH_OIDC_ENABLED:-false}

organization:
  name: ${ORGANIZATION_NAME:-sthings}

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  auth:
    keys:
      - secret: ${BACKEND_SECRET:-change-me-in-production}
    externalAccess:
      - type: static
        options:
          token: ${DAPR_SERVICE_TOKEN}
          subject: dapr-workflow-service
        # Restrict to scaffolder + catalog (catalog needed for dry-run
        # to look up templates by ref instead of passing inline bodies)
        accessRestrictions:
          - plugin: scaffolder
          - plugin: catalog

  baseUrl: ${BACKEND_BASE_URL:-http://localhost:7007}
  listen:
    port: ${BACKEND_PORT:-7007}
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: ${CORS_ORIGIN:-http://localhost:3000}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
    plugin:
      # RAG-AI embeddings live in their own pgvector Postgres (rag-postgres),
      # so the main database needs no pgvector. Only used when
      # RAG_AI_ENABLED=true; see README "RAG-AI".
      rag-ai:
        client: pg
        # The database is created by CNPG (owner rag); rag has no CREATEDB.
        ensureExists: false
        connection:
          host: ${RAG_PG_HOST:-}
          port: ${RAG_PG_PORT:-5432}
          database: ${RAG_PG_DATABASE:-backstage_rag}
          user: ${RAG_PG_USER:-rag}
          password: ${RAG_PG_PASSWORD:-}
  # RAG-AI is optional: if rag-postgres or the LLM API key is missing, the
  # backend starts without it instead of failing.
  startup:
    plugins:
      rag-ai:
        onPluginBootFailure: continue
        modules:
          llm:
            onPluginModuleBootFailure: continue
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  endpoints:
    '/claim-machinery':
      target: ${CLAIM_MACHINERY_API_URL:-https://claim-api.dev-infra-pre.sthings-vsphere.labul.sva.de}
      changeOrigin: true
      secure: false
      pathRewrite:
        '^/api/proxy/claim-machinery': ''
      allowedHeaders: ['*']
      credentials: 'dangerously-allow-unauthenticated'
    '/machinery-registry':
      target: ${CLAIM_MACHINERY_REGISTRY_URL:-https://claim-api.dev-infra-pre.sthings-vsphere.labul.sva.de}
      changeOrigin: true
      secure: false
      pathRewrite:
        '^/api/proxy/machinery-registry': ''
      allowedHeaders: ['*']
      credentials: 'dangerously-allow-unauthenticated'

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: development
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        ## uncomment if using GitHub Enterprise
        # enterpriseInstanceUrl: ${GHE_URL}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
    # OIDC provider (Zitadel). Block is always present so substitution works
    # everywhere; the backend module is only loaded when AUTH_OIDC_ENABLED=true
    # (see packages/backend/src/index.ts), so unset env vars don't blow up
    # GitHub-only environments. Provisioned by the zitadel-config Terraform
    # module on stuttgart-things.
    oidc:
      development:
        metadataUrl: ${ZITADEL_ISSUER:-}
        clientId: ${ZITADEL_CLIENT_ID:-}
        clientSecret: ${ZITADEL_CLIENT_SECRET:-}
        prompt: auto
        signIn:
          resolvers:
            # Match on email first (works for federated users with no GitHub
            # entity), fall back to username for legacy entities.
            - resolver: emailMatchingUserEntityProfileEmail
            - resolver: usernameMatchingUserEntityName

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

# Claim Machinery API configuration
claimMachinery:
  apiUrl: ${CLAIM_MACHINERY_API_URL:-https://claim-api.dev-infra-pre.sthings-vsphere.labul.sva.de}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # Organizational data from separate repository
    - type: url
      target: https://github.com/stuttgart-things/backstage-resources/blob/main/org/sthings-dev/org.yaml
      rules:
        - allow: [User, Group]

    # Central catalog index with all services and templates
    - type: url
      target: https://github.com/stuttgart-things/backstage-resources/blob/main/services/sthings-dev/catalog-index.yaml
      rules:
        - allow: [Component, Location, System, API, Resource, Template]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# Roadie RAG-AI: questions on catalog and TechDocs, see README "RAG-AI".
# Off unless RAG_AI_ENABLED=true. Chat and embeddings go to an
# OpenAI-compatible endpoint (LLM_*), OpenRouter by default (free models, like
# homerun2-ai-pitcher). Block is always present so substitution works
# everywhere; nothing is loaded while ragAi.enabled is false.
ragAi:
  enabled: ${RAG_AI_ENABLED:-false}
  llm:
    baseUrl: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
    apiKey: ${LLM_API_KEY:-}
    # Comma-separated, most reliable first; OpenRouter falls back to the
    # next ones (at most 3) when the first is down or rate-limited.
    models: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free}
    maxTokens: ${LLM_MAX_TOKENS:-4000}
  # Re-creates the embeddings of catalog and TechDocs (README "Indexing").
  # Only kinds and TechDocs whose content changed since the last run cost
  # embeddings requests.
  indexing:
    enabled: ${RAG_INDEX_ENABLED:-true}
    # Crontab, pod time zone (usually UTC).
    schedule: ${RAG_INDEX_SCHEDULE:-0 3 * * *}

ai:
  supportedSources: ['catalog', 'tech-docs']
  prompts:
    prefix: >-
      You answer questions about the stuttgart-things platform from the
      Backstage catalog entities and TechDocs pages given below. Answer in the
      language of the question. If the documents do not contain the answer,
      say so; do not make up components, URLs or commands. Documents:
  embeddings:
    chunkSize: 1000
    chunkOverlap: 200
    # Free OpenRouter models allow 20 requests/minute.
    concurrencyLimit: ${RAG_EMBEDDINGS_CONCURRENCY:-2}
    openai:
      openAiBaseUrl: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      openAiApiKey: ${LLM_API_KEY:-}
      # Changing the model changes the vector size: delete and re-create the
      # embeddings afterwards (README "RAG-AI").
      modelName: ${LLM_EMBEDDINGS_MODEL:-nvidia/nemotron-3-embed-1b:free}
      # Texts per embeddings request. nemotron-3-embed-1b:free takes at most
      # 256 (Roadie's default 512 is rejected). A literal number on purpose:
      # Roadie reads this block raw, an env string would break the batching.
      batchSize: 128
  storage:
    pgVector:
      # Chunks added to each question as context.
      amount: ${RAG_CONTEXT_CHUNKS:-6}
